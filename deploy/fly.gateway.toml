# fly deploy --config deploy/fly.gateway.toml --dockerfile Dockerfile
app = "tokengrid-gateway"
primary_region = "iad"
# Streams can run for many minutes; give them time to finish on deploy.
kill_signal = "SIGTERM"
kill_timeout = 300

[build]
  dockerfile = "../Dockerfile"
  build-target = "gateway"

[env]
  GATEWAY_PORT = "8787"
  NODE_ENV = "production"

[http_service]
  internal_port = 8787
  force_https = true
  # Never scale to zero: a stopped machine drops in-flight streams and the
  # first request pays a cold start in the user's latency.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2

  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    path = "/healthz"
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
